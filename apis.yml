aid: procurify
name: Procurify
description: >
  Procurify is an intelligent spend management and procure-to-pay platform that
  provides organizations with unprecedented visibility and control over business
  spend. The platform offers a RESTful API that enables developers to integrate
  procurement workflows — including purchase requests, approvals, purchase
  orders, vendor management, and budget tracking — into their own systems and
  processes. Authentication is handled via OAuth 2.0 client credentials flow,
  with tokens scoped to the requesting domain and user. The API supports core
  spend management resources such as requisitions, purchase orders, accounts
  payable, receipts, account codes, vendors, and catalog items, all returning
  and consuming JSON. Procurify does not support webhooks; all integrations are
  pull-based through the REST endpoints documented at developer.procurify.com.
