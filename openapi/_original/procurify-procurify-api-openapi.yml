  /oauth/token:
    post:
      servers:
      - url: https://<your-domain>.procurify.com
        description: Authenticate with oauth
      operationId: api_account_code_retrieve
      summary: Authenticate with OAuth
      description: "Getting access to Procurify API involves the following three steps:\n\
        \n  1. Request credentials for your Procurify account.\n  2. Request access\
        \ token using your credentials.\n  3. Use access token to access Procurify\
        \ API resources.\n\n#### Request credentials for your Procurify account.\n\
        \nThe first step is to request credentials from Procurify. Your role must\
        \ have access to manage integrations settings in order to request API credentials.\
        \ You can request API credentials by going to go:\n\n  1. Settings in the\
        \ left navigation bar.\n  2. Integrations in the Tools section.\n  3. View\
        \ button beside API item\n\nThis page will allow you to enter an optional\
        \ description of the application you are developing with the Procurify API\
        \ and once you are ready, click on “Create Application”. On the next screen,\
        \ you will be presented with a Client ID and a Client Secret. You will need\
        \ to copy and save these credentials securely. Please note that the Client\
        \ Secret is only presented once.\n\n#### Request access token using your credentials.\n\
        \nOnce you have the client credentials, you will need to request an access\
        \ token using these credentials that can be used as a bearer token when making\
        \ a request to Procurify API. You will need the following information to request\
        \ an access token:\n\n|Info|Value|\n--- | ---\n|Token URL:|https://&lt;your-domain&gt;.procurify.com/oauth/token|\n\
        |Client ID:|*From the previous step*|\n|Client Secret:|*From the previous\
        \ step*|\n|Audience:|https://api.procurify.com/|\n|Grant Type:|client_credentials|\n\
        \nOnce you have the access token, you will need to cache it until it expires\
        \ (24 hrs). Please let Procurify support know if you would like help with\
        \ this.\n\n\nAn example request and response using cURL (replace client id\
        \ and client secret)\n\n    $ curl -H \"content-type: application/json\" -X\
        \ POST \\\n        -d '{\"client_id\": \"~your_client_id~\", \\\n        \
        \     \"client_secret\": \"~your_client_secret~\", \\\n             \"audience\"\
        : \"https://api.procurify.com/\", \\\n             \"grant_type\": \"client_credentials\"\
        }' \\\n        https://<your-domain>.procurify.com/oauth/token\n\n    {\"\
        access_token\": \"~your-access-token~\",\n     \"scope\": \"urn:procurify-api:domain:~your_domain~\
        \ urn:procurify-api:email:~your_email~\",\n     \"expires_in\": 86400,\n \
        \    \"token_type\": \"Bearer\"}\n\n\n#### Use access token to access Procurify\
        \ API resources.\n\nOnce you have the access token, you can make requests\
        \ to Procurify API resources. You will need to set the following headers when\
        \ making the request.\n\n|Key|Value|\n--- | ---\n|Authorization:|Bearer *access_token\
        \ from previous step*|\n|X-Procurify-Client:|api|\n\n\nAn example request\
        \ and response using cURL (replace access token and your procurify domain)\n\
        \n    $ curl -H \"Authorization: Bearer ~access_token~\" \\\n        -H \"\
        X-Procurify-Client: api\" \\\n        https://<your-domain>.procurify.com/api/v3/vendors/\n\
        \n        {\"data\":[{\"id\":1,\"name\":\"OTHER\",\"active\":true,\"addressLineOne\"\
        :\"OTHER\"...}"
      parameters: []
      tags:
      - oauth
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                client_secret:
                  type: string
                audience:
                  type: string
                grant_type:
                  type: string
            example:
              client_id: ~your_client_id~
              client_secret: ~your_client_secret~
              audience: https://api.procurify.com/
              grant_type: client_credentials
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  scope:
                    type: string
                  expires_in:
                    type: number
                  token_type:
                    type: string
                    enum:
                    - Bearer
              example:
                access_token: ~your-access-token~
                scope: urn:procurify-api:domain:~your_domain~ urn:procurify-api:email:~your_email~
                expires_in: 86400
                token_type: Bearer
