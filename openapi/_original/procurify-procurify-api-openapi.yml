  /api/v3/vendors/:
    get:
      operationId: vendors_list
      description: '**Vendor Type Codes**


        | Vendor Type         | Type      | Description                       |

        |---------------------|-----------|-----------------------------------|

        | OTHER               | 1         | Previously ''OTHER'' vendor (ID=1), used
        for storing non-vendor

        |                     |           | for storing non-vendor Vendor names in
        request. |

        | HIDDEN              | 2         | New type of vendors that is reserved for
        system purposes (eg. Amazon Business). |

        | PREFERRED (default) | 3         | The default vendors from previous list

        |                     |           | where active vendor dropdowns everywhere
        previously showed.

        |                     |           | Request now ONLY shows these vendors (+OTHER)
        |

        | REGULAR             | 4         | New type of vendors that are non-preferred,

        |                     |           | for any AP purposes and purchasers to
        update.

        |                     |           | (DOES NOT show up in Request, but shows
        up in Procure) |

        | EMPLOYEE            | 5         | New type of vendors that do not show up
        anywhere except in AP employees list. |

        | CC_PROVIDER         | 6         | Similar type of vendors to AP employees,
        but for AP credit card providers. |'
      summary: Get list of all active vendors
      parameters:
      - in: query
        name: exclude_other
        schema:
          type: boolean
      - in: query
        name: external_id
        schema:
          type: string
      - in: query
        name: format
        schema:
          type: string
          enum:
          - csv
          - json
      - in: query
        name: name
        schema:
          type: string
      - name: order_by
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: integer
          enum:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          - 7
        description: 'Type of the vendor. See above for possible options.


          * `1` - other

          * `2` - amazon punchout

          * `3` - preferred

          * `4` - regular

          * `5` - employee

          * `6` - credit card provider

          * `7` - checkout'
      - in: query
        name: type__in
        schema:
          type: array
          items:
            type: string
            enum:
            - amazon_punchout
            - cc_provider
            - checkout
            - employee
            - other
            - pending
            - preferred
            - regular
        description: '* `other` - other

          * `amazon_punchout` - amazon_punchout

          * `preferred` - preferred

          * `regular` - regular

          * `employee` - employee

          * `cc_provider` - cc_provider

          * `checkout` - checkout

          * `pending` - pending'
        explode: true
        style: form
      - in: path
        name: vendor_group
        schema:
          type: string
          enum:
          - all
          - credit_card_providers
          - default
          - other
          - preferred
          - purchasable
          - requestable
        description: '

          **"all"**: Get list of all vendors.


          **"credit_card_providers"**: Get list of credit card provider vendors. These
          vendors are displayed in Payee Management for Credit Card Providers.


          **"default"**: Get list of "preferred" and "regular" vendors. These vendors
          are displayed in Procure (procurement, vendors, etc) and AP i.e., default
          vendor list. OTHER is discontinued from procure.


          **"other"**: Get list of "other" vendors. Only returns the ''OTHER'' vendor
          reserved for requesting non-vendor names.


          **"preferred"**: Get list of "preferred" vendors.


          **"purchasable"**: Get list of "purchasable" vendors.


          **"requestable"**: Get list of "requestable" vendors. These vendors are
          displayed in Request and designated by Purchaser.'
        required: true
      tags:
      - vendors
      security:
      - RemoteAuthentication: []
      - M2MAuthentication: []
      - BasicAuthentication: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOptimizedVendorList'
            text/csv:
              schema:
                $ref: '#/components/schemas/PaginatedOptimizedVendorList'
          description: ''
