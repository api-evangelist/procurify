          description: ''
  /api/v2/ap/company-payment-methods/:
    get:
      operationId: ap_company_payment_methods_list
      description: '**Payment Method Types:**


        | Payment Method | Type      |

        |----------------|-----------|

        | OTHER          | 0         |

        | CHECK/CHEQUE   | 1         |

        | ACH            | 2         |

        | EFT            | 3         |

        | WIRE           | 4         |


        **The context of ''data'' field varies based on different Payment Method type:**


        | Payment Method | ''data'' field structure |

        |----------------|------------------------|

        | OTHER          | ```{"description": <string>}``` |

        | CHECK/CHEQUE   | ```{"payable_to": <string>}```  |

        | ACH            | ```{"routing_number": <string>, "account_number": <string>,
        "company_name": <string>}``` |

        '
      summary: Get list of Company Payment Methods
      parameters:
      - in: query
        name: currency
        schema:
          type: integer
      - in: query
        name: format
        schema:
          type: string
          enum:
          - csv
          - json
      - name: order_by
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: integer
          title: Payment Method
          enum:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          - 7
          - 8
        description: '* `0` - OTHER

          * `1` - CHECK

          * `2` - ACH

          * `3` - EFT

          * `4` - WIRE

          * `5` - PROCURIFY_CHECK

          * `6` - PROCURIFY_ACH

          * `7` - PROCURIFY_WIRE

          * `8` - AIRWALLEX'
      tags:
      - ap
      security:
      - RemoteAuthentication: []
      - M2MAuthentication: []
      - BasicAuthentication: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCompanyPaymentMethodReadList'
              examples:
                CompanyPaymentMethods:
                  value:
                    metadata:
                      pagination:
                        count: 10
                        next: null
                        previous: null
                        page_size: 10
                        num_pages: 1
                        current_page: 1
                    data:
                    - id: 1
                      name: Bank Account
                      type: 0
                      data:
                        description: Bank Account description
                      currency:
                        id: 3
                        name: USD
                        description: ''
                        rate: '1.000000'
                        base: true
                        active: true
                      gl_code: '9000'
                  summary: Company Payment Methods
            text/csv:
              schema:
                $ref: '#/components/schemas/PaginatedCompanyPaymentMethodReadList'
          description: ''
    post:
      operationId: ap_company_payment_methods_create
      description: '**Payment Method Types:**


        | Payment Method | Type      |

        |----------------|-----------|

        | OTHER          | 0         |

        | CHECK/CHEQUE   | 1         |

        | ACH            | 2         |

        | EFT            | 3         |

        | WIRE           | 4         |


        **The context of ''data'' field varies based on different Payment Method type:**


        | Payment Method | ''data'' field structure |

        |----------------|------------------------|

        | OTHER          | ```{"description": <string>}``` |

        | CHECK/CHEQUE   | ```{"payable_to": <string>}```  |

        | ACH            | ```{"routing_number": <string>, "account_number": <string>,
        "company_name": <string>}``` |

        '
      summary: Create Company Payment Method
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - csv
          - json
      tags:
      - ap
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyPaymentMethodRequest'
            examples:
              CompanyPaymentMethodPayloadExample:
                value:
                  name: Bank Account
                  type: 0
                  data:
                    description: Bank Account description
                  gl_code: '9000'
                  currency: 3
                summary: Company Payment Method Payload Example
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CompanyPaymentMethodRequest'
          ? ''
          : schema:
              $ref: '#/components/schemas/CompanyPaymentMethodRequest'
            examples:
              CompanyPaymentMethodPayloadExample:
                value:
                  name: Bank Account
                  type: 0
                  data:
                    description: Bank Account description
                  gl_code: '9000'
                  currency: 3
                summary: Company Payment Method Payload Example
          application/xml:
            schema:
              $ref: '#/components/schemas/CompanyPaymentMethodRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CompanyPaymentMethodRequest'
        required: true
      security:
      - RemoteAuthentication: []
      - M2MAuthentication: []
      - BasicAuthentication: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyPaymentMethod'
              examples:
                CompanyPaymentMethodResponseExample:
                  value:
                    id: 1
                    name: Bank Account
                    type: 0
                    data:
                      description: Bank Account description
                    currency:
                      id: 3
                      name: USD
                      description: ''
                      rate: '1.000000'
                      base: true
                      active: true
                    gl_code: '9000'
                  summary: Company Payment Method Response Example
            text/csv:
              schema:
                $ref: '#/components/schemas/CompanyPaymentMethod'
          description: ''
