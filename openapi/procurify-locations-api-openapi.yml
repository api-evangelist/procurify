          maximum: 2147483647
        locationTimezone:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/LocationTimezoneEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
          type: integer
        headquarter:
          type: boolean
          readOnly: true
        department_count:
          type: integer
          readOnly: true
        active:
          type: boolean
        external_id:
          type: string
          nullable: true
          description: External id
          maxLength: 100
        legal_entity:
          allOf:
          - $ref: '#/components/schemas/LegalEntitySummary'
          readOnly: true
          nullable: true
          type: object
      required:
      - currency
      - name
      - phoneOne
      - primary_billing_address
      - primary_shipping_address
