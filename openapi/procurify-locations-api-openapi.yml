      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        url:
          type: string
          format: uri
          nullable: true
          maxLength: 200
        logo:
          type: string
        currency:
          $ref: '#/components/schemas/Currency'
        phoneOne:
          type: string
          maxLength: 20
        fax:
          type: string
          nullable: true
          maxLength: 20
        email:
          type: string
          format: email
          nullable: true
          maxLength: 254
        primary_billing_address:
          $ref: '#/components/schemas/Address'
        primary_shipping_address:
          $ref: '#/components/schemas/Address'
