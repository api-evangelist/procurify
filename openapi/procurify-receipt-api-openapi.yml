openapi: 3.2.0
info:
  title: Procurify API Documentation Receipt API
  version: ''
  description: '# Disclaimer


    - Procurify’s API is evolving and is subject to change at any time.'
servers:
- url: https://{user_domain}.procurify.com
  description: Your Procurify domain
  variables:
    user_domain:
      default: your-domain
      description: Your procurify domain
tags:
- name: Receipt
paths:
  /api/v3/receipt/items/:
    get:
      operationId: receipt_items_list
      description: Return a list of receipt items representing individual receiving actions.
      summary: Get list of receipt items by order item
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - csv
          - json
      - name: order_by
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: order_item
        schema:
          type: integer
        description: The ID of an order item to retrieve receipt items (receiving actions) for.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Receipt
      security:
      - RemoteAuthentication: []
      - M2MAuthentication: []
      - BasicAuthentication: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReceiptItemReadList'
            text/csv:
              schema:
                $ref: '#/components/schemas/PaginatedReceiptItemReadList'
          description: ''
    post:
      operationId: receipt_items_create
      description: Perform a receiving action for order items within a single purchase order.
      summary: Create a receipt item for an order item
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - csv
          - json
      tags:
      - Receipt
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ItemWriteRequest'
          ? ''
          : schema:
              $ref: '#/components/schemas/ItemWriteRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/ItemWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ItemWriteRequest'
        required: true
      security:
      - RemoteAuthentication: []
      - M2MAuthentication: []
      - BasicAuthentication: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptItemRead'
            text/csv:
              schema:
                $ref: '#/components/schemas/ReceiptItemRead'
          description: ''
components:
  schemas:
    PaginatedReceiptItemReadList:
      type: object
      properties:
        pagination:
          type: object
          properties:
            count:
              type: integer
              example: 10
            next:
              type:
              - string
              - 'null'
              format: uri
              example: null
            previous:
              type:
              - string
              - 'null'
              format: uri
              example: null
            page_size:
              type: integer
              example: 10
            num_pages:
              type: integer
              example: 1
            current_page:
              type: integer
              example: 1
        data:
          type: array
          items:
            $ref: '#/components/schemas/ReceiptItemRead'
    ReceiptItemRead:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        pass_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,5})?$
        fail_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,5})?$
        order_item:
          type: integer
        created_at:
          type: string
          format: date-time
          readOnly: true
        is_edited:
          type: boolean
          readOnly: true
        created_by:
          $ref: '#/components/schemas/SimpleUserProfile'
        total_quantity:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,5})?$
          readOnly: true
        received_at:
          type:
          - string
          - 'null'
          format: date
      required:
      - created_by
      - order_item
    SimpleUserProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        role:
          allOf:
          - $ref: '#/components/schemas/MinimalRoleRead'
          readOnly: true
        profile_image:
          type:
          - string
          - 'null'
      required:
      - email
    MinimalRoleRead:
      type: object
      properties:
        name:
          type: string
          maxLength: 150
        type:
          type: integer
      required:
      - name
      - type
    ItemWriteRequest:
      type: object
      properties:
        order_item:
          type: integer
          description: The ID of an order item that you wish to create a receipt for. This will be the id property found in the PO or Order Items responses for this item.
        pass_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,5})?$
        fail_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,5})?$
      required:
      - fail_quantity
      - order_item
      - pass_quantity
  securitySchemes:
    BasicAuthentication:
      type: http
      scheme: basic
    M2MAuthentication:
      type: http
      scheme: bearer
      bearerFormat: JWT
    RemoteAuthentication:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://<your-domain>.procurify.com/oauth/authorize
          tokenUrl: https://<your-domain>.procurify.com/oauth/token
          scopes: {}
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
