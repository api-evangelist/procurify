          type: string
          nullable: true
          title: Postal Code
          description: Postal or Zip code of the vendor
          maxLength: 20
        city:
          type: string
          nullable: true
          description: City of the vendor
          maxLength: 50
        state_province:
          type: string
          nullable: true
          title: State/Province
          description: State or Province of the vendor
          maxLength: 40
        country:
          type: string
          nullable: true
          description: Country of the vendor
          maxLength: 80
        phoneOne:
          type: string
          nullable: true
          description: Primary phone no. of the vendor
          maxLength: 20
        phoneTwo:
          type: string
          nullable: true
          description: Secondary phone no. of the vendor
          maxLength: 20
        fax:
          type: string
          nullable: true
          description: Fax no. of the vendor
          maxLength: 20
        email:
          type: array
          items:
            type: string
            format: email
            minLength: 1
        comments:
          type: string
          nullable: true
          description: Notes about the vendor
        contact:
          type: string
          nullable: true
          description: Contact person of the vendor
          maxLength: 50
        url:
          type: string
          nullable: true
          description: Website of the vendor
          maxLength: 200
        external_id:
          type: string
          nullable: true
          description: External id of the vendor
          maxLength: 100
        currency:
          type: integer
          nullable: true
        payment_term_ref:
          allOf:
          - $ref: '#/components/schemas/PaymentTermRequest'
